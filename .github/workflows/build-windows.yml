name: Build Windows Installer

# Roda numa máquina Windows de verdade fornecida pelo GitHub — o instalador
# de verdade do Tauri (.exe/.msi) não compila direito fora do Windows.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Cargo (acelera builds seguintes)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            node-js/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('node-js/src-tauri/Cargo.lock') }}

      - name: Instalar dependências do Node
        working-directory: node-js
        run: npm install

      - name: Instalar o Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Compilar o instalador do QuickDeck
        working-directory: node-js
        run: cargo tauri build

      - name: Publicar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: QuickDeck-Windows-Installer
          path: |
            node-js/src-tauri/target/release/bundle/nsis/*.exe
            node-js/src-tauri/target/release/bundle/msi/*.msi
